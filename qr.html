<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR – Presentaciones SST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .logo { font-size: 2rem; margin-bottom: 12px; }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 32px;
    }

    /* INPUT URL */
    .url-row {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    #url-input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 14px;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color .2s;
    }

    #url-input:focus { border-color: #a78bfa; }
    #url-input::placeholder { color: #475569; }

    #btn-gen {
      background: linear-gradient(135deg, #a78bfa, #f472b6);
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .2s;
    }

    #btn-gen:hover { opacity: .85; }

    /* QR BOX */
    #qr-box {
      background: #fff;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin-bottom: 20px;
      min-width: 220px;
      min-height: 220px;
    }

    #qr-box img { display: block; border-radius: 4px; }

    #qr-placeholder {
      color: #94a3b8;
      font-size: 0.85rem;
      text-align: center;
    }

    /* URL DISPLAY */
    #url-display {
      background: rgba(167,139,250,0.08);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.8rem;
      color: #a78bfa;
      word-break: break-all;
      margin-bottom: 16px;
      display: none;
    }

    /* COPY BTN */
    #btn-copy {
      background: rgba(167,139,250,0.12);
      border: 1px solid rgba(167,139,250,0.25);
      border-radius: 10px;
      padding: 9px 24px;
      color: #a78bfa;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background .2s;
      display: none;
    }

    #btn-copy:hover { background: rgba(167,139,250,0.22); }

    /* PRESENTACIONES LIST */
    .pres-links {
      margin-top: 28px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 20px;
    }

    .pres-links p { font-size: 0.78rem; color: #64748b; margin-bottom: 12px; }

    .pres-link-btn {
      display: block;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 16px;
      color: #e2e8f0;
      font-size: 0.83rem;
      cursor: pointer;
      margin-bottom: 8px;
      text-align: left;
      width: 100%;
      transition: background .2s, border-color .2s;
    }

    .pres-link-btn:hover { background: rgba(167,139,250,0.1); border-color: rgba(167,139,250,0.3); }
    .pres-link-btn span { color: #a78bfa; font-weight: 600; }

    .tip {
      margin-top: 24px;
      font-size: 0.76rem;
      color: #475569;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">📱</div>
  <h1>Compartir por QR</h1>
  <p class="subtitle">Pega la URL del túnel y genera el código QR al instante</p>

  <div class="url-row">
    <input
      id="url-input"
      type="url"
      placeholder="https://xxxx.trycloudflare.com"
      autocomplete="off"
      spellcheck="false"
    />
    <button id="btn-gen" onclick="generarQR()">Generar QR</button>
  </div>

  <div id="qr-box">
    <div id="qr-placeholder">
      📷<br/>El QR aparecerá aquí
    </div>
    <img id="qr-img" src="" alt="Código QR" style="display:none; width:200px; height:200px;"/>
  </div>

  <div id="url-display"></div>
  <button id="btn-copy" onclick="copiarURL()">📋 Copiar URL</button>

  <!-- Accesos rápidos a presentaciones -->
  <div class="pres-links" id="pres-links" style="display:none;">
    <p>O genera QR directo para una presentación:</p>
    <button class="pres-link-btn" onclick="usarURL(this)" data-path="/presentaciones/rutas-quejas-acoso/">
      🤝 <span>Rutas de Reporte</span> · Acoso Laboral y Convivencia
    </button>
    <button class="pres-link-btn" onclick="usarURL(this)" data-path="/presentaciones/salud-mental-sst/">
      🧠 <span>Salud Mental</span> · SST
    </button>
    <button class="pres-link-btn" onclick="usarURL(this)" data-path="/">
      📊 <span>Índice</span> · Todas las presentaciones
    </button>
  </div>

  <p class="tip">💡 El QR funciona mientras tu PC esté encendido y el túnel activo</p>
</div>

<script>
  let urlBase = '';

  function generarQR() {
    const input = document.getElementById('url-input').value.trim();
    if (!input) { alert('Pega la URL del túnel primero'); return; }

    // Limpiar trailing slash
    urlBase = input.replace(/\/$/, '');
    mostrarQR(urlBase);
    document.getElementById('pres-links').style.display = 'block';
  }

  function usarURL(btn) {
    if (!urlBase) { alert('Primero genera un QR con la URL base'); return; }
    const ruta = btn.dataset.path;
    mostrarQR(urlBase + ruta);
  }

  function mostrarQR(url) {
    const size   = 200;
    // Usamos la API de QR Server (sin límites, sin API key)
    const qrUrl  = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(url)}&bgcolor=ffffff&color=0f0f1a&margin=1`;

    const img = document.getElementById('qr-img');
    const placeholder = document.getElementById('qr-placeholder');

    img.src = qrUrl;
    img.style.display = 'block';
    placeholder.style.display = 'none';

    const display = document.getElementById('url-display');
    display.textContent = url;
    display.style.display = 'block';

    document.getElementById('btn-copy').style.display = 'inline-block';
  }

  function copiarURL() {
    const url = document.getElementById('url-display').textContent;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('btn-copy');
      btn.textContent = '✅ Copiado';
      setTimeout(() => { btn.textContent = '📋 Copiar URL'; }, 2000);
    });
  }

  // Auto-rellenar si viene URL en hash: qr.html#https://...
  window.addEventListener('load', () => {
    const hash = location.hash.slice(1);
    if (hash.startsWith('http')) {
      document.getElementById('url-input').value = decodeURIComponent(hash);
      generarQR();
    }
  });
</script>

</body>
</html>
